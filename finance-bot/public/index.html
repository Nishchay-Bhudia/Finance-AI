<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Finance Assistant</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f8f9;
    --border: #e7e9ec;
    --text: #14171a;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eef3ff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
  }

  .header-inner {
    width: 100%;
    max-width: 760px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mark {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--mono);
  }

  header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header .sub {
    font-size: 12px;
    color: var(--muted);
    margin-left: 2px;
  }

  .status-pill {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
  }

  main {
    width: 100%;
    max-width: 760px;
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
